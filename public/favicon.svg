<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a33" />
      <stop offset="40%" stop-color="#002244" />
      <stop offset="100%" stop-color="#003366" />
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA8015" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>

    <!-- Inner Radial Glow -->
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#004488" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#001830" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Rounded Square / Shield Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="20" />

  <!-- Inner Soft Glow -->
  <rect x="26" y="26" width="460" height="460" rx="98" fill="url(#glow)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#D4AF37" stroke-width="4" stroke-dasharray="10 8" opacity="0.4" />

  <!-- Open Book of Knowledge Base (Lower Center) -->
  <g id="book" transform="translate(0, 30)">
    <!-- Book Left Page -->
    <path d="M 256 340 C 210 320 150 316 110 326 C 104 328 100 334 100 340 L 100 400 C 100 406 106 412 112 410 C 150 400 210 404 256 424 Z" 
          fill="#FFFFFF" opacity="0.95" />
    
    <!-- Book Right Page -->
    <path d="M 256 340 C 302 320 362 316 402 326 C 408 328 412 334 412 340 L 412 400 C 412 406 406 412 400 410 C 362 400 302 404 256 424 Z" 
          fill="#FFFFFF" opacity="0.95" />

    <!-- Book Spine Divider & Golden Accent -->
    <path d="M 256 338 L 256 425" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <path d="M 124 355 C 160 348 206 352 242 366" stroke="#D4AF37" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M 124 375 C 160 368 206 372 242 386" stroke="#D4AF37" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M 388 355 C 352 348 306 352 270 366" stroke="#D4AF37" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M 388 375 C 352 368 306 372 270 386" stroke="#D4AF37" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Golden Graduation Cap (Mortarboard) & Tassel -->
  <g id="cap" transform="translate(0, -10)">
    <!-- Cap Under Skull Section -->
    <path d="M 176 220 C 176 256 336 256 336 220 L 336 244 C 336 276 176 276 176 244 Z" 
          fill="url(#goldGrad)" />

    <!-- Cap Diamond Top -->
    <polygon points="256,110 420,180 256,246 92,180" 
             fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" />

    <!-- Button on Top of Cap -->
    <ellipse cx="256" cy="180" rx="14" ry="9" fill="#002244" stroke="#FFF" stroke-width="3" />

    <!-- Tassel Ribbon & Ring -->
    <path d="M 256 182 Q 330 200 352 245 L 358 290 Q 366 295 362 305 Q 354 300 350 290 L 344 246 Q 324 206 256 182 Z" 
          fill="#FFFFFF" />
    <circle cx="356" cy="295" r="7" fill="url(#goldGrad)" />
  </g>

  <!-- Torch / Star of Excellence & Guidance at the Top -->
  <g id="star" transform="translate(256, 75)">
    <!-- 8-Pointed Star -->
    <path d="M 0,-30 L 7,-9 L 28,-9 L 11,4 L 17,25 L 0,12 L -17,25 L -11,4 L -28,-9 L -7,-9 Z" 
          fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Decorative Laurel / Wheat Leaves on Bottom Sides -->
  <g id="wreath" stroke="url(#goldGrad)" fill="url(#goldGrad)" opacity="0.9">
    <!-- Left Leaves -->
    <path d="M 72 270 Q 64 330 96 380 Q 76 340 82 290 Z" />
    <path d="M 68 310 Q 56 350 78 390 Q 66 356 74 322 Z" />
    <!-- Right Leaves -->
    <path d="M 440 270 Q 448 330 416 380 Q 436 340 430 290 Z" />
    <path d="M 444 310 Q 456 350 434 390 Q 446 356 438 322 Z" />
  </g>
</svg>
